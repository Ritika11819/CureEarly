services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all", "--noauth"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  model-service:
    build:
      context: ./models
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/curearly}
    volumes:
      - ./models:/models:ro
    ports:
      - "8000:8000"
    depends_on:
      - mongo

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/curearly}
      JWT_SECRET: ${JWT_SECRET:-curearly-secure-jwt-token-signing-secret-key-32-bytes-minimum}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PREDICTION_SERVICE_URL: http://model-service:8000
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:-}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:-}
    ports:
      - "8082:8080"
    depends_on:
      - mongo
      - model-service

  frontend:
    build: ./frontend/curearly
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8082
      VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    ports:
      - "5173:5173"
    depends_on:
      - api

  mongo-express:
    image: mongo-express:1.0.2-20
    restart: unless-stopped
    profiles: ["admin"]
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/curearly
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "8081:8081"
    depends_on:
      - mongo

volumes:
  mongo-data:
